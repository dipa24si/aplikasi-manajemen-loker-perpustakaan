services:
  # -------------------------------------------------------------
  # 1. BACKEND API (Express.js)
  # Terhubung ke Database Server Eksternal (172.16.9.8:3308)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loker-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      # Konfigurasi Server Database Eksternal
      DB_HOST: "172.16.9.8"
      DB_PORT: 3308
      DB_USER: "root"
      DB_PASS: "rootpassword123"
      DB_NAME: "locker_db"
      JWT_SECRET: super_secret_jwt_key_library_locker_2026
      JWT_EXPIRES_IN: 1d
      DENDA_PER_HARI: 5000
      JAM_TUTUP: "16:00"
    ports:
      - "5000:5000"
    networks:
      - loker-network

  # -------------------------------------------------------------
  # 2. FRONTEND (React SPA + Nginx Reverse Proxy)
  # Diarahkan ke port 1034 (http://172.16.9.6:1034)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Akses aplikasi web melalui browser di http://172.16.9.6:1034
      - "1034:80"
    networks:
      - loker-network

# -------------------------------------------------------------
# NETWORKS
# -------------------------------------------------------------
networks:
  loker-network:
    name: loker_network
    driver: bridge
